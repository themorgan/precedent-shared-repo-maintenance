# Install as .github/workflows/practice-links-travel.yml in a PRACTICE SOURCE
# repository -- one whose practices/ it authors itself and materializes into
# consuming repos. A consuming repo should not carry this workflow: there the
# vendored precedent_check.py runs the check on its own, because a consumer
# that resolves the practice HAS the practice file.
#
# WHY THIS EXISTS (practice: cite-the-incident). `practice-links-travel` says a
# relative link in a practice file is only real if the link's target is copied
# into the consumer too. It is the rule that protects everything this repo
# publishes -- and it does not run here.
#
# precedent_check.py gates every practice-backed check on `practices/<slug>.md`
# being present in the repo it runs in (see its `run()`), which is right for a
# consumer: a finding whose Rule the reader cannot even print is a finding
# nobody can act on. A SOURCE set is the case that gate gets wrong. Its
# practices/ holds its OWN practices, never another level's, so every check
# belonging to another level skips -- permanently, not pending configuration.
# Measured in this repo on 2026-09-12: 12 checks passed, 42 SKIPPED, and all
# 42 skipped for exactly that reason. `--only practice-links-travel` reports
# `1 skipped`, and a skip is not a pass.
#
# What that cost, measured: practices/deep-check.md shipped a relative link to
# tools/checks/tests/run_all.sh -- a file materialization deliberately does not
# copy, being the driver rather than a per-check file. The link was live here
# and dead in every repository that received the catalogue, every sync in a
# consumer printed the not-vendored line for it once per source, and nothing
# here noticed. A CONSUMING repo caught it, one sync late, because the practice
# is in force there and skips here. Fixed in PR #44; this workflow is the half
# that makes something look next time.
#
# This is the same shape, and the same remedy, as .github/workflows/views-drift.yml:
# a universal check that cannot fire in a source set gets a workflow that calls
# the underlying logic directly. It covers ONE rule. The other 41 skips are a
# design question for the engine -- whether a check can declare that it binds
# any repo publishing a practices/ tree, rather than depending on the practice
# text being locally present -- and a workflow per rule is not the answer to it.
#
# IT GATES, IT DOES NOT FIX. The repair belongs on the branch, by whoever wrote
# the link: drop the link markup and keep the backticked path, or make it an
# absolute https://github.com/... URL on this repo's declared base branch. On a
# private source prefer dropping the markup -- an absolute URL into a private
# repository ships into every consumer, which private-repo-scrub exists to stop.
#
# IT REFUSES RATHER THAN PASSING BLIND. No engine vendored, the engine nested
# under process/upstream/, the slug gone from the registry, or the check
# reporting NotApplicable -- each exits non-zero with its own message. A green
# check that checked nothing is the failure this workflow was written to end.
name: Practice links travel

on:
  pull_request:
  workflow_dispatch:

# No `paths:` filter on purpose, for the reason views-drift.yml gives: the
# check takes under a second, and its inputs are wider than they look -- every
# practice file, practices/MANIFEST.json, precedent.json's base_branch, the
# vendored engine's own file list. A filter that misses one input is a workflow
# that reports nothing while looking green.

# Read-only on purpose: this reports, and has no business holding a token that
# could write.
permissions:
  contents: read

jobs:
  practice-links-travel:
    name: Practice links travel to consumers
    runs-on: ubuntu-latest

    steps:
      # The PR HEAD, not refs/pull/N/merge: auditing the merge tree reports
      # findings belonging to neither branch, which the author cannot act on.
      - name: Check out the pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refuse if this repo is not a source set carrying the engine
        run: |
          set -eu
          if [ ! -f tools/precedent_check.py ]; then
            if [ -f process/upstream/tools/precedent_check.py ]; then
              echo "This repo vendors the engine under process/upstream/, which is" \
                   "INSTALL.md section 1's CONSUMING-repo layout. There practices/ is" \
                   "materialized from its sources, the practice file IS present, and the" \
                   "vendored precedent_check.py runs this check by itself. Remove this" \
                   "workflow: it is for a source set." >&2
              exit 1
            fi
            echo "No tools/precedent_check.py -- the engine was never vendored into this" \
                 "repo, or it lives somewhere this workflow does not know about. Vendor it" \
                 "(tools/precedent_vendor_engine.py) or add the path here." >&2
            exit 1
          fi
          if [ ! -d practices ]; then
            echo "No practices/ directory -- this repo publishes no practice files, so" \
                 "there is nothing for practice-links-travel to be about. Remove this" \
                 "workflow." >&2
            exit 1
          fi

      - name: Check that every practice link travels
        run: |
          set -eu
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'tools')

          SLUG = 'practice-links-travel'

          # The Rule is stated here rather than read from practices/<SLUG>.md
          # through precedent_check's own reader, for the reason this workflow
          # exists at all: that file is NOT in this repo. Everywhere else in
          # this engine the failure message IS the rule, read from the file so
          # it cannot drift. Here it cannot be, so it is quoted -- and if the
          # upstream wording changes, this string is what goes stale. Keep it
          # to the sentence the practice leads with.
          RULE = ('A practice file is copied into every repository that adopts the '
                  'catalogue, so a relative link in one is only real if the target '
                  'is copied too.')

          try:
              import precedent_check as pc
          except Exception as e:
              sys.exit(f'FAILED to import tools/precedent_check.py ({e!r}). This '
                       f'workflow calls the check directly, so it cannot report on '
                       f'a module it cannot load.')

          entry = pc.CHECKS.get(SLUG)
          if entry is None:
              sys.exit(f'FAILED: no check registered as {SLUG!r} in the vendored '
                       f'precedent_check.py. Either the engine here predates it or '
                       f'upstream renamed it. Refusing rather than passing: this '
                       f'workflow exists to run that check, and a green result '
                       f'without it would be a lie. Registered slugs: '
                       f'{", ".join(sorted(pc.CHECKS))}')

          # The check is scope `tree` and reads the repo off precedent_check's
          # own ROOT, never off ctx -- so a bare object is the whole contract.
          # Calling it directly is the deliberate bypass: precedent_check.run()
          # would skip it here, and a skip is not a pass.
          class _Ctx:
              pass

          try:
              findings = entry['fn'](_Ctx()) or []
          except pc.NotApplicable as e:
              sys.exit(f'NOT CHECKED: the check reported it could not run -- {e}. In a '
                       f'repo that authors its own practices this means the gate has '
                       f'stopped covering what it was installed to cover (most likely a '
                       f'practices/MANIFEST.json now attributing every file here to '
                       f'another source). Fix the attribution, or remove this workflow '
                       f'if this repo no longer publishes its own practices.')

          if findings:
              print(f'VIOLATION  {SLUG}', file=sys.stderr)
              for f in findings:
                  print(f'    {f}', file=sys.stderr)
              print(f'\n  the rule:\n    {RULE}', file=sys.stderr)
              print('\n  Repair either way named by the rule: drop the link markup and '
                    'keep the backticked path, or use an absolute '
                    'https://github.com/<owner>/<repo>/blob/<base-branch>/<path> URL. '
                    'On a private source prefer dropping the markup -- an absolute URL '
                    'into a private repository ships into every consumer.',
                    file=sys.stderr)
              sys.exit(1)

          n = len(list((__import__('pathlib').Path('practices')).glob('*.md')))
          print(f'OK: every link in this repo\'s {n} practice files travels with the '
                f'file (or is an absolute URL into this repository that resolves). '
                f'Checked by calling {SLUG} directly, because precedent_check.py skips '
                f'it here -- the practice text belongs to another level and is not '
                f'vendored into this set.')
          PY
